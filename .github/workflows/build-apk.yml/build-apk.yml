
name: Build ME CHITS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and Build
        run: |
          unzip -o ME_CHITS_v2_Source.zip
          cd ME_CHITS
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ME-CHITS-APK
          path: ME_CHITS/app/build/outputs/apk/debug/app-debug.apk
