name: Build ME CHITS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          find . -maxdepth 3 -name gradlew -o -name settings.gradle -o -name settings.gradle.kts
